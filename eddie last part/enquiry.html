<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request information about Apex Bakery custom cakes, event catering, and bulk bread orders.">
    <title>Bakery Orders &amp; Catering Enquiry | Apex Bakery</title>
    <link rel="canonical" href="https://snazzy-cannoli-789af1.netlify.app/enquiry.html">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header>
        <p class="brand-name">Apex Bakery</p>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html" aria-current="page">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section>
            <h1>Product &amp; Custom Order Enquiry</h1>
            <p>Tell us what you need and when. We will confirm availability and provide a quote after reviewing your request.</p>

            <form id="enquiry-form" action="mailto:tinarax04@gmail.com" method="post" enctype="text/plain" data-email-subject="Apex Bakery product or service enquiry">
                <div class="form-honeypot" aria-hidden="true">
                    <label for="website">Leave this field empty</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" autocomplete="name" minlength="2" maxlength="80" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>

                <label for="enquiry-phone">Phone Number:</label>
                <input type="tel" id="enquiry-phone" name="phone" autocomplete="tel" pattern="[+0-9() -]{7,20}" title="Enter 7 to 20 characters using digits, spaces, +, parentheses, or hyphens." required>

                <label for="service">Select Service/Product:</label>
                <select id="service" name="service" required>
                    <option value="" selected disabled>Select a product or service</option>
                    <option value="custom-cake">Custom Cake</option>
                    <option value="catering">Event Catering</option>
                    <option value="bulk-bread">Bulk Order</option>
                </select>

                <label for="quantity">Approximate quantity (loaves, servings, or guests):</label>
                <input type="number" id="quantity" name="quantity" min="1" max="5000" step="1" required>

                <label for="requested-date">Preferred date (optional):</label>
                <input type="date" id="requested-date" name="requested-date">

                <label for="message">Enquiry Details:</label>
                <textarea id="message" name="details" rows="5" minlength="15" maxlength="2000" required></textarea>

                <button type="submit">Submit Enquiry</button>
            </form>
            <p class="form-status" role="status" aria-live="polite" hidden></p>
            <noscript><p>Complete this form to open an email draft addressed to tinarax04@gmail.com. Review and send the draft from your email app.</p></noscript>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Apex Bakery. All rights reserved.</p>
    </footer>
    <script src="js/script.js" defer></script>
</body>
</html>
